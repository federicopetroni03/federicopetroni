<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noindex, nofollow, noarchive">

    <title>Federico Petroni</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 24px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: linear-gradient(
                135deg,
                #111827,
                #312e81
            );

            color: white;
        }

        .card {
            width: 100%;
            max-width: 430px;

            padding: 40px 28px 28px;

            text-align: center;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.12);

            border-radius: 28px;

            backdrop-filter: blur(18px);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.35);
        }

        .avatar {
            width: 105px;
            height: 105px;

            margin: 0 auto 22px;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 34px;
            font-weight: 700;

            background: linear-gradient(
                135deg,
                #6366f1,
                #8b5cf6
            );
        }

        h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .role {
            color: #cbd5e1;
            font-size: 16px;
            margin-bottom: 28px;
        }

        .description {
            color: #cbd5e1;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link {
            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 54px;

            border-radius: 14px;

            text-decoration: none;

            color: white;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.10);

            font-weight: 600;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .link:hover {
            transform: translateY(-2px);

            background: rgba(255, 255, 255, 0.16);
        }

        .icon {
            margin-right: 10px;
            font-size: 18px;
        }

        footer {
            margin-top: 28px;

            font-size: 12px;

            color: #94a3b8;
        }
    </style>
</head>

<body>

    <main class="card">

        <div class="avatar">
            FP
        </div>

        <h1>Federico Petroni</h1>

        <p class="role">
            Ingegnere Gestionale
        </p>

        <p class="description">
            Benvenuto nella mia pagina personale.
            Qui puoi trovare i miei contatti professionali.
        </p>

        <div class="links">

            <a
                class="link"
                href="mailto:federicopetroni.ing@gmail.com"
            >
                <span class="icon">✉️</span>
                Email
            </a>

            <a
                class="link"
                href="https://www.linkedin.com/in/federico-petroni/"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="icon">in</span>
                LinkedIn
            </a>

        </div>

        <footer>
            © 2026 Federico Petroni
        </footer>

    </main>

</body>
</html>
