<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noindex, nofollow, noarchive">

    <title>Federico Petroni | Ingegnere Gestionale</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 24px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(99, 102, 241, 0.20),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(139, 92, 246, 0.18),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e1b4b
                );

            color: #ffffff;
        }

        .card {
            width: 100%;
            max-width: 440px;

            padding: 42px 30px 30px;

            text-align: center;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.14);

            border-radius: 28px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.40);
        }

        .avatar {
            width: 110px;
            height: 110px;

            margin: 0 auto 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 36px;
            font-weight: 700;
            letter-spacing: -1px;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            box-shadow:
                0 12px 35px rgba(99, 102, 241, 0.35);

            border: 3px solid rgba(255, 255, 255, 0.12);
        }

        h1 {
            font-size: 31px;
            line-height: 1.2;
            font-weight: 700;

            margin-bottom: 8px;

            letter-spacing: -0.6px;
        }

        .role {
            font-size: 17px;
            color: #cbd5e1;

            margin-bottom: 28px;
        }

        .description {
            max-width: 350px;

            margin: 0 auto 30px;

            font-size: 15px;
            line-height: 1.65;

            color: #cbd5e1;
        }

        .links {
            display: flex;
            flex-direction: column;

            gap: 13px;
        }

        .link {
            min-height: 56px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 15px 18px;

            border-radius: 15px;

            border: 1px solid rgba(255, 255, 255, 0.11);

            background: rgba(255, 255, 255, 0.08);

            color: #ffffff;

            text-decoration: none;

            font-size: 15px;
            font-weight: 600;

            transition:
                transform 0.20s ease,
                background 0.20s ease,
                border-color 0.20s ease;
        }

        .link:hover {
            transform: translateY(-2px);

            background:
                rgba(255, 255, 255, 0.15);

            border-color:
                rgba(255, 255, 255, 0.20);
        }

        .link:active {
            transform: translateY(0);
        }

        .icon {
            margin-right: 10px;

            font-size: 18px;

            line-height: 1;
        }

        footer {
            margin-top: 30px;

            font-size: 12px;

            color: #94a3b8;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .card {
                padding: 34px 22px 25px;

                border-radius: 24px;
            }

            .avatar {
                width: 96px;
                height: 96px;

                font-size: 32px;
            }

            h1 {
                font-size: 27px;
            }

            .role {
                font-size: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            .link {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <div class="avatar">
            FP
        </div>

        <h1>
            Federico Petroni
        </h1>

        <p class="role">
            Ingegnere Gestionale
        </p>

        <p class="description">
            Benvenuto nella mia pagina personale.
            Qui puoi trovare i miei contatti professionali,
            le mie esperienze e il mio curriculum.
        </p>

        <div class="links">

            <!-- EMAIL -->
            <a
                class="link"
                href="mailto:federicopetroni.ing@gmail.com"
            >
                <span class="icon">✉️</span>
                Email
            </a>

            <!-- LINKEDIN -->
            <a
                class="link"
                href="https://www.linkedin.com/in/federico-petroni/"
                target="_blank"
                rel="noopener noreferrer"
            >
                LinkedIn
            </a>

            <!-- PROGETTI ED ESPERIENZE -->
            <a
                class="link"
                href="esperienze.html"
            >
                <span class="icon">💼</span>
                Progetti ed Esperienze
            </a>

            <!-- CV -->
            <a
                class="link"
                href="CV_Federico_Petroni.pdf"
                download
            >
                <span class="icon">📄</span>
                Scarica il CV
            </a>

        </div>

        <footer>
            © 2026 Federico Petroni
        </footer>

    </main>

</body>

</html>
